<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>EnFlaim | Under Maintenance</title>

<link rel="icon" type="image/png" href="../../assets/images/EnFevicon.png">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.12), transparent 35%),
            linear-gradient(135deg, #050812 0%, #090d1b 50%, #050812 100%);

        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 30px;
        overflow: hidden;
    }

    /* Background decoration */

    .background {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .orb {
        position: absolute;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        background: rgba(139, 92, 246, 0.08);
        filter: blur(80px);
    }

    .orb.one {
        top: -180px;
        left: -120px;
    }

    .orb.two {
        bottom: -200px;
        right: -120px;
        background: rgba(59, 130, 246, 0.06);
    }

    /* Main card */

    .maintenance {
        position: relative;
        width: 100%;
        max-width: 760px;

        padding: 65px 45px;

        text-align: center;

        background: rgba(12, 17, 32, 0.72);

        border: 1px solid rgba(255, 255, 255, 0.08);

        border-radius: 28px;

        box-shadow:
            0 30px 80px rgba(0, 0, 0, 0.45),
            inset 0 1px 0 rgba(255, 255, 255, 0.03);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
    }

    /* Logo */

    .logo-wrapper {
        width: 130px;
        height: 130px;

        margin: 0 auto 35px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 30px;

        background: rgba(255, 255, 255, 0.025);

        border: 1px solid rgba(255, 255, 255, 0.07);

        box-shadow:
            0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .logo {
        display: block;

        width: 95px;
        height: auto;

        object-fit: contain;
    }

    /* Status */

    .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;

        padding: 8px 14px;

        margin-bottom: 22px;

        border-radius: 999px;

        background: rgba(139, 92, 246, 0.10);

        border: 1px solid rgba(139, 92, 246, 0.22);

        color: #c4b5fd;

        font-size: 12px;
        font-weight: 600;

        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    .status-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #a78bfa;

        box-shadow: 0 0 12px rgba(167, 139, 250, 0.8);
    }

    /* Heading */

    h1 {
        font-size: clamp(34px, 6vw, 58px);

        line-height: 1.08;

        font-weight: 700;

        letter-spacing: -1.8px;

        margin-bottom: 22px;
    }

    .accent {
        background: linear-gradient(
            90deg,
            #ffffff,
            #c4b5fd
        );

        -webkit-background-clip: text;
        background-clip: text;

        -webkit-text-fill-color: transparent;
    }

    /* Divider */

    .line {
        width: 55px;
        height: 3px;

        margin: 0 auto 26px;

        border-radius: 20px;

        background: #8b5cf6;

        box-shadow:
            0 0 18px rgba(139, 92, 246, 0.45);
    }

    /* Description */

    p {
        max-width: 520px;

        margin: 0 auto;

        color: #aeb6c7;

        font-size: 16px;

        line-height: 1.8;
    }

    /* Footer */

    .footer {
        margin-top: 42px;

        padding-top: 22px;

        border-top: 1px solid rgba(255, 255, 255, 0.06);

        color: #687186;

        font-size: 12px;

        letter-spacing: 0.5px;
    }

    .footer strong {
        color: #8992a7;
        font-weight: 600;
    }

    /* Mobile */

    @media (max-width: 600px) {

        body {
            padding: 18px;
        }

        .maintenance {
            padding: 48px 24px;
            border-radius: 22px;
        }

        .logo-wrapper {
            width: 105px;
            height: 105px;

            margin-bottom: 28px;

            border-radius: 24px;
        }

        .logo {
            width: 78px;
        }

        h1 {
            font-size: 36px;
            letter-spacing: -1px;
        }

        p {
            font-size: 14px;
            line-height: 1.7;
        }

        .footer {
            margin-top: 32px;
        }
    }
</style>

</head><body><div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<main class="maintenance">

    <div class="logo-wrapper">

        <img
            class="logo"
            src="../../assets/images/EnLogo.png"
            alt="EnFlaim Logo"
        >

    </div>

    <div class="status">
        <span class="status-dot"></span>
        Website Maintenance
    </div>

    <h1>
        Currently <span class="accent">Under Maintenance</span>
    </h1>

    <div class="line"></div>

    <p>
        We are currently working on something new.
        <br>
        EnFlaim will be back soon.
    </p>

    <div class="footer">
        <strong>EnFlaim</strong> · Building Ideas &amp; Creating Opportunities.
    </div>

</main>

</body>
    </html>
