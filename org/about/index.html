<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EnFlaim | Under Maintenance</title>

    <link rel="icon" type="image/png" href="assets/images/EnFevicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #070b17;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .maintenance {
            width: 100%;
            max-width: 700px;
            padding: 40px 25px;
            text-align: center;
        }

        .logo {
            width: 190px;
            max-width: 70%;
            height: auto;
            margin-bottom: 45px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 56px);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 15px;
        }

        .line {
            width: 70px;
            height: 3px;
            background: #8b5cf6;
            margin: 0 auto 25px;
            border-radius: 10px;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            color: #aeb6c7;
        }

        @media (max-width: 600px) {
            .maintenance {
                padding: 30px 20px;
            }

            .logo {
                width: 150px;
                margin-bottom: 35px;
            }

            h1 {
                font-size: 34px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="maintenance">

        <img
            src="assets/images/EnLogo.png"
            alt="EnFlaim"
            class="logo"
        >

        <h1>Currently Under Maintenance</h1>

        <div class="line"></div>

        <p>
            We are currently working on something new.
            <br>
            EnFlaim will be back soon.
        </p>

    </main>

</body>
</html>
