<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EnFlaim | Under Maintenance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050b18;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 20px;
        }

        .logo {
            width: 180px;
            max-width: 70%;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        h1 span {
            color: #24a8ff;
        }

        p {
            color: #aebbd0;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .message {
            margin-top: 25px;
            font-size: 14px;
            color: #71809a;
        }

        .line {
            width: 70px;
            height: 3px;
            background: #24a8ff;
            margin: 25px auto;
            border-radius: 10px;
        }

        .footer {
            margin-top: 45px;
            font-size: 13px;
            color: #536178;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            src="EnLogo.png"
            alt="EnFlaim Logo"
            class="logo"
        >

        <h1>
            Currently <span>Under Maintenance</span>
        </h1>

        <div class="line"></div>

        <p>
            We're currently working on something bigger.
        </p>

        <p>
            The EnFlaim website is being built.
            Please check back soon.
        </p>

        <p class="message">
            Building Ideas & Creating Opportunities.
        </p>

        <div class="footer">
            © 2026 EnFlaim
        </div>

    </main>

</body>
  </html>
