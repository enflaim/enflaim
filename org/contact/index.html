<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>EnFlaim | Under Maintenance</title>

<!-- Favicon -->
<link rel="icon" type="image/png"
      href="/enflaim/org/assets/images/EnFevicon.png">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100vh;

        background:
            radial-gradient(
                circle at 50% 15%,
                rgba(139, 92, 246, 0.14),
                transparent 38%
            ),
            #070b17;

        color: #ffffff;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        overflow: hidden;
    }

    /* Background glow */

    .glow {
        position: fixed;

        width: 420px;
        height: 420px;

        border-radius: 50%;

        background: rgba(139, 92, 246, 0.07);

        filter: blur(100px);

        pointer-events: none;
    }

    .glow.top {
        top: -250px;
        left: 50%;

        transform: translateX(-50%);
    }

    .glow.bottom {
        right: -250px;
        bottom: -250px;

        background: rgba(59, 130, 246, 0.05);
    }

    /* Main */

    .maintenance {
        position: relative;

        width: 100%;
        max-width: 720px;

        text-align: center;

        padding: 65px 40px;

        background: rgba(12, 17, 32, 0.82);

        border: 1px solid rgba(255, 255, 255, 0.08);

        border-radius: 28px;

        box-shadow:
            0 30px 80px rgba(0, 0, 0, 0.45);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }

    /* Logo */

    .logo {
        display: block;

        width: 180px;
        max-width: 65%;

        height: auto;

        margin: 0 auto 42px;

        object-fit: contain;
    }

    /* Status */

    .status {
        display: inline-flex;

        align-items: center;

        gap: 8px;

        padding: 8px 14px;

        margin-bottom: 22px;

        border-radius: 50px;

        background: rgba(139, 92, 246, 0.10);

        border: 1px solid rgba(139, 92, 246, 0.22);

        color: #c4b5fd;

        font-size: 12px;

        font-weight: 600;

        letter-spacing: 1.4px;

        text-transform: uppercase;
    }

    .dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #a78bfa;

        box-shadow:
            0 0 12px rgba(167, 139, 250, 0.8);
    }

    /* Heading */

    h1 {
        font-size: clamp(34px, 6vw, 56px);

        line-height: 1.1;

        font-weight: 700;

        letter-spacing: -1.8px;

        margin-bottom: 20px;
    }

    .accent {
        color: #c4b5fd;
    }

    /* Divider */

    .line {
        width: 60px;
        height: 3px;

        margin: 0 auto 26px;

        border-radius: 10px;

        background: #8b5cf6;

        box-shadow:
            0 0 18px rgba(139, 92, 246, 0.45);
    }

    /* Text */

    p {
        max-width: 520px;

        margin: 0 auto;

        color: #aeb6c7;

        font-size: 16px;

        line-height: 1.8;
    }

    /* Footer */

    .footer {
        margin-top: 40px;

        padding-top: 22px;

        border-top:
            1px solid rgba(255, 255, 255, 0.06);

        color: #687186;

        font-size: 12px;

        letter-spacing: 0.4px;
    }

    .footer strong {
        color: #8d96aa;
    }

    /* Mobile */

    @media (max-width: 600px) {

        body {
            padding: 16px;
        }

        .maintenance {
            padding: 48px 24px;

            border-radius: 22px;
        }

        .logo {
            width: 150px;

            margin-bottom: 34px;
        }

        h1 {
            font-size: 36px;

            letter-spacing: -1px;
        }

        p {
            font-size: 14px;
        }
    }
</style>

</head><body><div class="glow top"></div>
<div class="glow bottom"></div>

<main class="maintenance">

    <!-- EnFlaim Logo -->
    <img
        class="logo"
        src="/enflaim/org/assets/images/EnLogo.png"
        alt="EnFlaim"
    >

    <div class="status">
        <span class="dot"></span>
        Website Maintenance
    </div>

    <h1>
        Currently
        <span class="accent">Under Maintenance</span>
    </h1>

    <div class="line"></div>

    <p>
        We are currently working on something new.
        <br>
        EnFlaim will be back soon.
    </p>

    <div class="footer">
        <strong>EnFlaim</strong>
        · Building Ideas &amp; Creating Opportunities.
    </div>

</main>

</body>
  </html>
